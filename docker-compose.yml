services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journal_platform
    ports:
      - "5432:5432"
    volumes:
      - journal_platform_pgdata:/var/lib/postgresql/data

volumes:
  journal_platform_pgdata:
